name: aviasales_analytics
version: "1.0.0"
config-version: 2

profile: aviasales_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  aviasales_analytics:
    staging:
      +materialized: view
      +schema: analytics_staging
    marts:
      +materialized: view
      +schema: analytics_marts